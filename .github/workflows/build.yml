name: Build Bronzeman SPT 4.1.3 compatibility

on:
  push:
    branches:
      - fix/spt-4.1.3-compatibility
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Bronzeman.csproj

      - name: Build
        run: dotnet build Bronzeman.csproj --configuration Release --no-restore

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bronzeman-2.0.1-SPT-4.1.3
          path: bin/Release/net10.0/
          if-no-files-found: error
